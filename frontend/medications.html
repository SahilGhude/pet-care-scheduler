<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medication Management</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="header-logo">
        <img src="images/pcs-logo.jpeg">
        <span>Pet Care Scheduler</span>
    </div>
</header>
<div class="sidebar">

    <div class="logo">
    <img src="images/pcs-logo.jpeg" alt="PCS Logo">
    <h2>PCS</h2>
</div>

    <a href="index.html">🏠 Dashboard</a>
    <a href="profile.html">👤 Profile</a>
    <a href="pets.html">🐶 Pets</a>
    <a href="vaccinations.html">💉 Vaccinations</a>
    <a href="medications.html" class="active">💊 Medications</a>
    <a href="appointments.html">📅 Appointments</a>

</div>

<div class="main">

    <h1>💊 Medication Management</h1>

    <div class="card summary-card">
        <h3>Total Medications</h3>
        <p id="totalMedications">0</p>
    </div>

    <form id="medicationForm">

        <input type="hidden" id="medicationId">

        <select id="pet_id" required>
            <option value="">Select Pet</option>
        </select>

        <input
            type="text"
            id="medicine_name"
            placeholder="Medicine Name"
            required
        >

        <input
            type="text"
            id="dosage"
            placeholder="Dosage"
            required
        >

        <input
            type="text"
            id="frequency"
            placeholder="Frequency"
            required
        >

        <input
            type="date"
            id="start_date"
            required
        >

        <input
            type="date"
            id="end_date"
            required
        >

        <input
            type="time"
            id="reminder_time"
            required
        >

        <select id="status" required>
    <option value="">Select Status</option>
    <option value="Pending">Pending</option>
    <option value="Completed">Completed</option>
    <option value="Cancelled">Cancelled</option>
</select>

        <button type="submit">
            ➕ Save Medication
        </button>

    </form>

    <table>

        <thead>
            <tr>
            <th>ID</th>
            <th>Pet ID</th>
            <th>Pet Name</th>
            <th>Medicine Name</th>
            <th>Dosage</th>
            <th>Frequency</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Reminder Time</th>
            <th>Status</th>
            <th>Actions</th>
</tr>
        </thead>

        <tbody id="medicationTable">

        </tbody>

    </table>

</div>

<script src="js/medications.js"></script>

</body>
</html>
