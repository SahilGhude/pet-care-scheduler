<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link rel="stylesheet" href="css/forgot_password.css">
</head>

<body>

    <div class="card">

        <div class="logo">
            🐾
        </div>

        <h2>Forgot Password</h2>

        <p class="subtitle">
            Reset your Pet Care Scheduler account password
        </p>

        <input
            type="email"
            id="email"
            placeholder="Enter Email"
        >

        <button onclick="sendOTP()">
            Send OTP
        </button>

        <input
            type="text"
            id="otp"
            placeholder="Enter OTP"
        >

        <button onclick="verifyOTP()">
            Verify OTP
        </button>

        <input
            type="password"
            id="new_password"
            placeholder="New Password"
        >

        <button onclick="resetPassword()">
            Reset Password
        </button>

        <p id="message"></p>

        <a
            href="login.html"
            class="back-link"
        >
            ← Back to Login
        </a>

    </div>

    <script src="js/forgot_password.js"></script>

</body>
</html>
