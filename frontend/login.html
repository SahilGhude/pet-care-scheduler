<!DOCTYPE html>
<html>
<head>
    <title>Login - Pet Care Scheduler</title>
    <link rel="stylesheet" href="css/style.css">
</head>

    <div class="auth-logo">
        <img src="images/pcs-logo.jpeg" alt="PCS Logo">

    <h2>Login to PCS</h2>

    <input

        id="email"

        id="password"
        placeholder="Password">
<div id="message"></div>

        Login

<br><br>

<a href="forgot_password.html">
    Forgot Password?
</a>

<br><br>

<a href="register.html">
    Create New Account
</a>
    <p id="message"></p>

    <br>

</div>

<script src="js/login.js"></script>

</body>
</html>
